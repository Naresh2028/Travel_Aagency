services:
  postgres:
    image: postgres:17-alpine
    container_name: skylimit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: skylimit_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Axis*2029
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - skylimit_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  skylimit_postgres_data: